# N-12: basic CI — typecheck + unit tests on push/PR to main
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

# Install: copy this file to .github/workflows/ci.yml
# (GitHub OAuth tokens need the `workflow` scope to create workflow files via git push.)
